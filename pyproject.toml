[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-agent"
version = "0.1.0"
description = "Self-healing NL-to-SQL agent with schema-aware RAG and optional semantic layer."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "sqlglot>=25.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "langgraph>=0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "streamlit>=1.36",
  "plotly>=5.22",
]

[project.optional-dependencies]
groq        = ["groq>=0.11"]
anthropic   = ["anthropic>=0.34"]
embed       = ["sentence-transformers>=3.0"]
postgres    = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
mysql       = ["pymysql>=1.1"]
langfuse    = ["langfuse>=2.50"]
dev         = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-q"
