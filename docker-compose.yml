# Optional support services for the paid path.
# The base agent runs without ANY of these. Use:
#   docker compose up -d postgres
#   docker compose up -d cube
#   docker compose --profile langfuse up -d
services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  cube:
    image: cubejs/cube:latest
    ports: ["4000:4000"]
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_NAME: warehouse
      CUBEJS_DB_USER: postgres
      CUBEJS_DB_PASS: postgres
      CUBEJS_API_SECRET: ${CUBE_API_SECRET:-devsecret}
      CUBEJS_DEV_MODE: "true"
    volumes:
      - ./cube/model:/cube/conf/model:ro
    depends_on: [postgres]

  # --- Langfuse stack (opt-in via profile) ---

  langfuse:
    profiles: [langfuse]
    image: langfuse/langfuse:3
    depends_on: [langfuse-db, langfuse-clickhouse, langfuse-redis, langfuse-minio]
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/postgres
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme-please}
      SALT: ${LANGFUSE_SALT:-changeme-please}
      NEXTAUTH_URL: http://localhost:3000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      S3_BUCKET: langfuse
      S3_ENDPOINT: http://langfuse-minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: miniominio
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: auto

  langfuse-db:
    profiles: [langfuse]
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres }
    volumes: [lfpg:/var/lib/postgresql/data]

  langfuse-clickhouse:
    profiles: [langfuse]
    image: clickhouse/clickhouse-server:24
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes: [lfch:/var/lib/clickhouse]

  langfuse-redis:
    profiles: [langfuse]
    image: redis:7

  langfuse-minio:
    profiles: [langfuse]
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniominio
    volumes: [lfminio:/data]

volumes:
  pgdata: {}
  lfpg: {}
  lfch: {}
  lfminio: {}
